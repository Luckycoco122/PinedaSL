<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <title>Flomatexs Construction Limited</title>
    <link rel="icon" href="img/flomatexs.png" type="image/x-icon">

    <!-- Favicon -->
    <link href="img/favicon.ico" rel="icon">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- CSS Libraries -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="lib/flaticon/font/flaticon.css" rel="stylesheet">
    <link href="lib/animate/animate.min.css" rel="stylesheet">
    <link href="lib/owlcarousel/assets/owl.carousel.min.css" rel="stylesheet">
    <link href="lib/lightbox/css/lightbox.min.css" rel="stylesheet">
    <link href="lib/slick/slick.css" rel="stylesheet">
    <link href="lib/slick/slick-theme.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

    <!-- Template Stylesheet -->
    <link href="css/style.css" rel="stylesheet">
  </head>

  <body>
    <div class="wrapper">
     <div data-include="FooterHeader/Header.html"></div>

      <!-- Page Header Start -->
      <div class="page-header">
        <div class="container">
          <div class="row">
            <div class="col-12">
              <h2>Contáctanos</h2>
            </div>
            <div class="col-12">
              <a href="">Inicio</a>
              <a href="">Contacto</a>
            </div>
          </div>
        </div>
      </div>
      <!-- Page Header End -->

      <!-- Contact Start -->
      <div class="contact wow fadeInUp">
        <div class="container">
          <div class="section-header text-center">
            <p>Ponte en contacto</p>
            <h2>Para cualquier consulta</h2>
          </div>
          <div class="row">
            <div class="col-md-6">
              <div class="contact-info">
                <div class="contact-item">
                  <i class="flaticon-address"></i>
                  <div class="contact-text">
                    <h2>Ubicación</h2>
                    <p>Madrid, España</p>
                  </div>
                </div>
                <div class="contact-item">
                  <i class="flaticon-call"></i>
                  <div class="contact-text">
                    <h2>Teléfono</h2>
                    <p>+34 627302910</p>
                    <p>+34 687261639</p>
                  </div>
                </div>
                <div class="contact-item">
                  <i class="flaticon-send-mail"></i>
                  <div class="contact-text">
                    <h2>Email</h2>
                    <p>multiserviciospineda@gmail.com</p>
                  </div>
                </div>
              </div>
            </div>

            <div class="col-md-6">
              <div class="contact-form">
                <div id="success"></div>
                <form name="sentMessage" id="contactForm" novalidate="novalidate">
                  <div class="control-group">
                    <input type="text" class="form-control" id="name" placeholder="Tu nombre" required="required" data-validation-required-message="Por favor, escribe tu nombre">
                    <p class="help-block text-danger"></p>
                  </div>
                  <div class="control-group">
                    <input type="email" class="form-control" id="email" placeholder="Tu email" required="required" data-validation-required-message="Por favor, escribe tu email">
                    <p class="help-block text-danger"></p>
                  </div>
                  <div class="control-group">
                    <input type="text" class="form-control" id="subject" placeholder="Asunto" required="required" data-validation-required-message="Por favor, escribe un asunto">
                    <p class="help-block text-danger"></p>
                  </div>
                  <div class="control-group">
                    <textarea class="form-control" id="message" placeholder="Mensaje" required="required" data-validation-required-message="Por favor, escribe tu mensaje"></textarea>
                    <p class="help-block text-danger"></p>
                  </div>
                  <div>
                    <button class="btn" type="submit" id="sendMessageButton">Enviar mensaje</button>
                  </div>
                </form>
              </div>
            </div>

          </div>
        </div>
      </div>
      <!-- Contact End -->

      <!-- Footer Start -->
       <div data-include="FooterHeader/Footer.html"></div>
   
    <!-- Contact Javascript File -->
    <script src="mail/jqBootstrapValidation.min.js"></script>
    <script src="mail/contact.js"></script>

    <!-- Template Javascript -->
    <script src="js/main.js"></script>
    <script src="js/include.js"></script>
  </body>
</html>
